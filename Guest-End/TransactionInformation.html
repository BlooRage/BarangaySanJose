    <script>
        let topBtn = document.getElementById("goToTop");
        let navbar = document.getElementById("mainNavbar");

        window.onscroll = function() {
            scrollFunction()
        };

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                topBtn.style.display = "block";
                if (navbar) {
                    navbar.classList.add("navbar--scrolled");
                }
            } else {
                topBtn.style.display = "none";
                if (navbar) {
                    navbar.classList.remove("navbar--scrolled");
                }
            }
        }

        function topFunction() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const banner = document.getElementById("verification-banner");
            const fields = {
                transactionId: document.getElementById("transaction-id"),
                orNumber: document.getElementById("or-number"),
                certificateNumber: document.getElementById("certificate-number"),
                status: document.getElementById("transaction-status"),
                validity: document.getElementById("validity-date"),
                docType: document.getElementById("doc-type"),
                fullName: document.getElementById("full-name"),
                purpose: document.getElementById("purpose")
            };

            function setField(el, value) {
                if (!el) return;
                const text = value && String(value).trim() !== "" ? String(value) : "-";
                el.textContent = text;
            }

            function setBanner(message, type) {
                if (!banner) return;
                banner.textContent = message;
                banner.className = "verification-banner verification-" + type;
            }

            async function loadTransactionInformation() {
                const params = new URLSearchParams(window.location.search);
                const requestId = (params.get("request_id") || "").trim();
                const verificationCode = (params.get("vc") || "").trim();

                if (!requestId || !verificationCode) {
                    setBanner("Invalid verification link. Missing request details.", "error");
                    return;
                }

                setBanner("Validating certificate link...", "loading");
                try {
                    const url = "../PhpFiles/GET/getTransactionInformation.php?request_id="
                        + encodeURIComponent(requestId) + "&vc=" + encodeURIComponent(verificationCode);
                    const response = await fetch(url, { credentials: "omit" });
                    const data = await response.json();

                    if (!response.ok || !data || !data.success || !data.data) {
                        throw new Error((data && data.message) ? data.message : "Unable to verify transaction.");
                    }

                    const item = data.data;
                    setField(fields.transactionId, item.request_id);
                    setField(fields.orNumber, item.or_number);
                    setField(fields.certificateNumber, item.certificate_number);
                    setField(fields.status, item.status);
                    setField(fields.validity, item.validity);
                    setField(fields.docType, item.document_type);
                    setField(fields.fullName, item.full_name);
                    setField(fields.purpose, item.purpose);
                    setBanner("Verified document record.", "ok");
                } catch (err) {
                    setBanner("Invalid or expired verification link.", "error");
                }
            }

            loadTransactionInformation();

            let track = document.querySelector(".council-track");
            let prevBtn = document.querySelector(".council-btn-prev");
            let nextBtn = document.querySelector(".council-btn-next");
            if (!track || !prevBtn || !nextBtn) {
                return;
            }
            let animating = false;
            let stepPercent = 33.333;
            function updateStep() {
                stepPercent = window.matchMedia("(max-width: 992px)").matches ? 100 : 33.333;
            }
            updateStep();
            window.addEventListener("resize", updateStep);

            let captainCard = track.querySelector(".captain-card");
            if (captainCard && window.matchMedia("(max-width: 992px)").matches) {
                track.insertBefore(captainCard, track.firstElementChild);
            }
            function getSlideTransition() {
                let styles = window.getComputedStyle(track);
                let duration = styles.getPropertyValue("--council-slide-duration").trim() || "0.5s";
                let easing = styles.getPropertyValue("--council-slide-ease").trim() || "ease";
                return "transform " + duration + " " + easing;
            }

            function moveNext() {
                if (animating) {
                    return;
                }
                animating = true;
                track.style.transform = "translateX(-" + stepPercent + "%)";
                track.addEventListener("transitionend", function handler() {
                    track.removeEventListener("transitionend", handler);
                    track.appendChild(track.firstElementChild);
                    track.style.transition = "none";
                    track.style.transform = "translateX(0)";
                    track.offsetHeight;
                    track.style.transition = getSlideTransition();
                    animating = false;
                });
            }

            function movePrev() {
                if (animating) {
                    return;
                }
                animating = true;
                track.style.transition = "none";
                track.insertBefore(track.lastElementChild, track.firstElementChild);
                track.style.transform = "translateX(-" + stepPercent + "%)";
                track.offsetHeight;
                track.style.transition = getSlideTransition();
                track.style.transform = "translateX(0)";
                track.addEventListener("transitionend", function handler() {
                    track.removeEventListener("transitionend", handler);
                    animating = false;
                });
            }

            nextBtn.addEventListener("click", moveNext);
            prevBtn.addEventListener("click", movePrev);
            setInterval(moveNext, 10000);
        });


    </script>
    <script>
        document.addEventListener("click", function (event) {
            var navbar = document.getElementById("navbarNav");
            var toggler = document.querySelector(".navbar-toggler");
            if (!navbar || !toggler) {
                return;
            }
            var isShown = navbar.classList.contains("show");
            if (!isShown) {
                return;
            }
            var clickedInside = navbar.contains(event.target) || toggler.contains(event.target);
            if (!clickedInside) {
                var collapse = bootstrap.Collapse.getOrCreateInstance(navbar);
                collapse.hide();
            }
        });
